# 라운드 설정 예시 — 이 파일을 loop.yaml 로 복사해서 경로만 고치세요(gitignore).
# 레시피에는 "어떻게 합성하는가"만 두고, "무엇으로 몇 번 돌리는가"는 여기 둡니다.
# 경로는 **이 파일 기준**입니다(스케줄러가 어느 폴더에서 부르든 같은 라운드를 가리키게).
#
#   anograft loop run       # 다음 단계부터 이어서 — 사람이 판정할 차례면 멈추고 알려 줍니다
#   anograft loop tick      # 스케줄러(작업 스케줄러·cron)가 부르는 같은 일 — 새로 들어온 이미지만 봅니다
#   anograft loop status    # 지금 어디인가 · champion · 최근 라운드 · 유입 커서

trainer: yolo # trainers.yaml 의 이름(명령이 아닙니다)
bank: bank/mine # 결함 보관함 — 채택분이 여기로 들어가고 합성이 여기서 나옵니다
recipe: recipes/round.yaml # 합성 레시피(은행·출력·형식·시드는 루프가 덮어씁니다)
out: loop/ # 라운드 폴더 루트

# 배포 모델이 스코어링할 현장 이미지(폴더 또는 .txt 목록). 계속 쌓이는 폴더를 그대로 두면 됩니다 —
# 이미 스코어링한 것은 유입 커서(<out>/processed.jsonl)가 걸러 줍니다(같은 이미지를 두 번 보지 않습니다).
# 없으면 수집 단계를 건너뛰고 합성만 도는 라운드가 됩니다.
field: field/

# 동결 평가셋 — 조립한 학습 데이터셋의 val 로 들어가고, fit 의 지표가 곧 라운드 점수입니다.
# **루프에 절대 넣지 않습니다**(<bank>/holdout.txt 에 같은 stem 을 적어 두면 코드가 막습니다).
eval:
  images: golden/images
  labels: golden/labels # yolo 형식. pairs 형식이면 masks: golden/masks

# 실제 학습분(있으면 train 에 합성과 함께 들어갑니다). 없으면 train 은 합성만.
train_base:
  images: real/images
  labels: real/labels

review:
  n: 30 # 사람이 한 라운드에 볼 장수
  threshold: 0.5 # 운영 임계값 — 이 근처가 '경계'
  mix: [0.6, 0.2, 0.2] # 경계 · 확신 · 무작위 (불일치 몫의 상한 = 경계 비율)
  # accept_class: scratch   # 예측이 클래스를 모를 때 이름을 고정
  # keep_whole: false       # 마스크를 성분으로 쪼개지 않고 통째로 한 조각으로
  # 처음 보는 형상(보관함 어느 조각과도 닮지 않은 것) 임계 0~1 · 0 = 끔.
  # 이 이상이면 검토 대기의 맨 앞에 오고, 채택해도 이름 없이 **미분류**로 들어갑니다
  # (틀린 이름은 그 클래스를 오염시키지만 미분류는 `bank promote` 한 줄로 되돌립니다).
  novelty_threshold: 0.6

promote:
  metric: mAP50 # fit 이 내는 평평한 지표 맵의 키
  noise: 0.04 # 학습 시드 요동(BENCHMARKS §2) — 이보다 작은 Δ 는 개선이 아닙니다

# 언제 새 라운드를 여는가 — `loop tick` 만 봅니다(사람이 부른 `loop run` 은 그냥 돕니다).
# 기본값은 전부 0 = 제한 없음(= 불릴 때마다 돕니다). 아래처럼 켜면 "N개 모이면, 단 7일에 한 번 이하"가 됩니다.
# 안 돈 이유는 tick.json 에, 사유가 바뀌면 rounds.jsonl 에도 남습니다(조용히 안 도는 루프를 만들지 않습니다).
trigger:
  min_labels: 0 # 지난 라운드 뒤로 보관함에 들어온 조각 수 (실무 제안: 20)
  min_images: 0 # 아직 스코어링하지 않은 현장 이미지 장수 (실무 제안: 200)
  min_interval_hours: 0 # 마지막 라운드로부터 최소 간격 (실무 제안: 168 = 7일)
  # max_interval_hours: 720  # 이만큼 지나면 양과 무관하게 한 바퀴(드리프트 감시, 30일)

# synth_count: 200          # 한 라운드에 만들 합성 장수(기본: 레시피의 output.count)
seed: 7
spec: {} # 학습기에 넘길 불투명 spec — 등록부 spec 위에 얕게 병합됩니다
# trainers_file: trainers.yaml
