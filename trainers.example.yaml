# 학습기 등록 예시 — 이 파일을 trainers.yaml 로 복사해서 경로만 고치세요.
# 레시피에는 이름만 씁니다(trainer: noop). 실행 명령은 여기에만 둡니다 — 레시피는 공유되니까요.
trainers:
  # 계약 검증·테스트용 더미. 학습하지 않고 가짜 예측만 냅니다(stdlib 만 씁니다).
  noop:
    command: [python, adapters/noop.py]

  # 실제 학습기는 별도 venv 를 가리킵니다(코어는 순수 wheel 만 씁니다).
  # ultralytics 가 설치된 venv 로 경로만 바꾸면 됩니다 — 어댑터는 adapters/yolo.py 그대로.
  # yolo:
  #   command: ["C:/Users/<you>/Documents/Workspace/.venvs/graft-train/Scripts/python.exe", "adapters/yolo.py"]
  #   spec: {model: yolov8n.pt, epochs: 40, imgsz: 640}   # 불투명 — 어댑터가 해석합니다
  #   timeout: 43200
  #
  # 등록한 뒤:
  #   anograft trainer list                    # 가용 여부·사유
  #   anograft trainer fit yolo --dataset out/set-A --out out/model --seed 7
  #   anograft trainer predict yolo --model out/model/train/weights/best.pt --images imgs.txt --out out/pred

  # 비지도(정상만 학습) — anomalib. 합성 결함은 **학습이 아니라 평가**에만 쓰입니다(trains_on: normal_only).
  # 데이터는 mvtec writer 출력의 카테고리 폴더(<out>/mvtec/<category>)를 그대로 줍니다.
  # anomalib:
  #   command: ["C:/Users/<you>/Documents/Workspace/.venvs/graft-train/Scripts/python.exe", "adapters/anomalib_trainer.py"]
  #   spec: {model: patchcore, image_size: 256}   # padim · fastflow · cfa · dfkde · dfm 도
  #   timeout: 43200
