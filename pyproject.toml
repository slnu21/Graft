[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anograft"
version = "0.12.0"
description = "Graft — 라벨링한 실제 결함을 정상 이미지에 이식해 정답 마스크·재현 정보가 붙은 학습용 이상 데이터셋을 만든다 / Graft real labeled defects onto normal images to build reproducible anomaly datasets with ground-truth masks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "slnu21" }]
keywords = ["anomaly-detection", "synthetic-data", "defect", "industrial-vision", "opencv", "yolo"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# 순수 wheel만 — 컴파일러·GPU 없이 어느 PC에서든 pip로 설치돼야 한다. 추가는 확인 게이트.
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.8,<5",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]
# GUI(v0.2+). PySide6는 LGPL — 동적 링크 유지, PyQt로 바꾸지 말 것. 코어 의존성에 넣지 않는다(CLI-only 설치는 순수 wheel 4개 그대로).
gui = ["PySide6>=6.6,<7"]
# v1.0 선택 플러그인(SAM·확산). 없으면 해당 프리셋이 비활성 + 이유 노출 (fail-soft).
torch = []
# Windows zip 빌드 전용(tools/build_zip.ps1 · packaging/anograft.spec). 배포물에 PyInstaller 코드는 들어가지 않는다(부트로더 예외).
build = ["pyinstaller>=6.6,<7"]

[project.scripts]
anograft = "anograft.cli:main"

[project.gui-scripts]
anograft-gui = "anograft.gui.__main__:main"

[project.urls]
Homepage = "https://github.com/slnu21/Graft"
Repository = "https://github.com/slnu21/Graft"
Issues = "https://github.com/slnu21/Graft/issues"

[tool.setuptools.packages.find]
where = ["src"]

# 프리셋은 패키지 안에 실어야 pip 설치만으로 동작한다. 예시 레시피는 repo 루트 recipes/.
[tool.setuptools.package-data]
anograft = [
  "presets/*.yaml",
  # 웹 번들(v0.10) — repo 에는 없고 CI 가 `npm run build` 로 넣은 뒤 빌드한다. 없으면 조용히 빠지고
  # `serve` 가 안내를 띄운다(fail-soft). 해시가 붙은 파일 이름이라 와일드카드로 받는다.
  "web/static/*",
  "web/static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["docs", ".venv"]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 한국어 주석·문자열의 유사 문자 경고
  "E501",  # 한글은 폭 2로 세어 100자 규칙이 맞지 않음 — 코드 줄 길이는 formatter가 맡는다
  "N812",  # 모듈을 대문자 별칭으로 import 허용 (recipe as R)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
