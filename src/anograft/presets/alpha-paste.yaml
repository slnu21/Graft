# Alpha Paste — 페더 합성. 알파는 경계 색이 안 맞으므로 Reinhard(Lab 3ch)로 색까지 정합
# 2026-09-14(#759 샘플 실측, 데브로그 07): feather 3 → 2(5px 스크래치가 페더에 먹힘; 1은 경계가 계단), reinhard 0.7 → 0.5
#   (0.7은 얇은 결함 대비가 hard-paste의 0.14, 0.5는 0.26; 0.3은 얼룩 경계가 그대로 드러남 — 알파는 그래디언트 정합이 없어 중간값).
pipeline:
  source:
    method: bank
    classes: null
    min_sources_warn: 10
  geometry:
    method: affine
    scale: [0.8, 1.25]
    rotate: [-180, 180]
    flip: true
    elastic: { alpha: 0, sigma: 4 }
  placement:
    method: sampled
    roi: { method: otsu, invert: auto, erode_px: 8 }
    distribution: uniform
    margin_px: 8
    max_tries: 50
    shrink_on_fail: { factor: 0.8, rounds: 3 }
  blend:
    method: alpha
    feather_px: 2
  harmonize:
    method: reinhard
    strength: 0.5
    ring_px: 12
  degrade:
    method: camera
    noise_sigma: [0, 2.0]
    blur_sigma: [0, 0.6]
    jpeg_quality: null
  gtmask:
    policy: union
    diff_threshold: 12
    dilate_px: 2