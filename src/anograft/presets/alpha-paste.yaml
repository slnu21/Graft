# Alpha Paste — 페더 합성. 알파는 경계 색이 안 맞으므로 Reinhard(Lab 3ch)로 색까지 강하게 정합
pipeline:
  source:
    method: bank
    classes: null
    min_sources_warn: 10
  geometry:
    method: affine
    scale: [0.8, 1.25]
    rotate: [-180, 180]
    flip: true
    elastic: { alpha: 0, sigma: 4 }
  placement:
    method: sampled
    roi: { method: otsu, invert: auto, erode_px: 8 }
    distribution: uniform
    margin_px: 8
    max_tries: 50
    shrink_on_fail: { factor: 0.8, rounds: 3 }
  blend:
    method: alpha
    feather_px: 3
  harmonize:
    method: reinhard
    strength: 0.7
    ring_px: 12
  degrade:
    method: camera
    noise_sigma: [0, 2.0]
    blur_sigma: [0, 0.6]
    jpeg_quality: null
  gtmask:
    policy: union
    diff_threshold: 12
    dilate_px: 2