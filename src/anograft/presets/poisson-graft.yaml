# Poisson Graft (기본) — NSA 계열. 결함 은행 → affine → ROI 샘플링 → Poisson(MIXED) → L채널 통계 정합 → 카메라 재현
pipeline:
  source:
    method: bank
    classes: null
    min_sources_warn: 10
  geometry:
    method: affine
    scale: [0.8, 1.25]
    rotate: [-180, 180]
    flip: true
    elastic: { alpha: 0, sigma: 4 }
  placement:
    method: sampled
    roi: { method: otsu, invert: auto, erode_px: 8 }
    distribution: uniform
    margin_px: 8
    max_tries: 50
    shrink_on_fail: { factor: 0.8, rounds: 3 }
  blend:
    method: poisson
    poisson_mode: mixed
    mask_dilate_px: 5          # seamlessClone이 마스크를 3px 침식 → 얇은 결함 보존에 필수
    feather_px: 3
  harmonize:
    method: stats
    strength: 0.5
    ring_px: 12
  degrade:
    method: camera
    noise_sigma: [0, 2.0]
    blur_sigma: [0, 0.6]
    jpeg_quality: null
  gtmask:
    policy: union
    diff_threshold: 12
    dilate_px: 2