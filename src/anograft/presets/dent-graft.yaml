# Dent Graft (v0.6, KNOWN-ISSUES #5) — 조명 의존 결함(찍힘·덴트·눌림·돌기)용. poisson-graft 위에 기하 변환만 보수적으로.
#
#   왜 회전을 제한하나: 찍힘은 3D 변형이라 "보이는 모양" 이 곧 조명 효과(한쪽 음영 + 반대쪽 하이라이트)다. 패치를 180° 돌리면
#   음영/하이라이트의 위아래가 뒤집히는데 대상의 조명은 돌지 않으므로 물리적으로 불가능한 그림이 된다 — 사람 눈이 가장 먼저
#   잡아내는 위화감(실데이터 1차 적용에서 확인). 스크래치·얼룩(텍스처성 결함)은 회전해도 되므로 다른 프리셋은 ±180 을 유지한다.
#   같은 이유로 flip 도 끈다(상하 뒤집기 = 조명 반전; 좌우도 비스듬한 조명이면 틀어진다).
#   rotate ±15 는 "촬영 지그의 흔들림" 정도. 조명 방향이 확실히 위/아래 대칭이면 rotate 를 [-5, 5] 로 더 조여도 된다.
#
#   배치: structure-aware 로 방향을 국소 구조(결·접선)에 맞춘다 — 원형 부품의 가공 링에서는 접선 정렬이 물리적으로 타당(찍힘의
#   긴 축이 가공 방향을 따르는 경향). prefer: uniform 이라 위치는 ROI 안 균등(찍힘은 모서리에만 생기지 않는다). 정렬이 geometry
#   회전을 덮어쓰므로, 정렬이 켜진 자리에서는 결과 각도 = 구조 방향 ± jitter_deg 이고 rotate 범위는 "정렬 못 한 자리" 에만 쓰인다.
#   조명 왜곡을 피하려면 jitter_deg 도 작게(5). 정렬을 아예 끄려면 align: none(그러면 rotate ±15 만 적용).
#   ROI: otsu(부품 전체). 원형 부품의 링 면만이면 roi 를 annulus 로(annulus-graft 참고) — 카드에서 바꿀 수 있다.
#   블렌딩: poisson NORMAL — 음영의 저주파를 대상 톤에 맞추되 하이라이트는 남긴다(MIXED 는 텍스처 결함용). 조화 strength 는
#   0.2 로 낮게 — 찍힘의 대비(음영 깊이)가 곧 결함 신호라 더 당기면 사라진다.
#
#   한계: 복사·붙여넣기는 조명 의존 결함을 원리적으로 재현할 수 없다(그 자리의 곡률·조명으로 새로 그려야 함 → v1.0 확산 인페인팅).
#   이 프리셋은 "물리적으로 틀린 그림을 만들지 않는" 쪽에 무게를 둔 보수적 설정이다.
pipeline:
  source:
    method: bank
    classes: null
    min_sources_warn: 10
  geometry:
    method: affine
    scale: [0.9, 1.1]          # 찍힘 크기는 공구·힘에 묶여 있어 분포가 좁다
    rotate: [-15, 15]          # 조명 의존 — ±180 금지 (위 주석)
    flip: none                 # 조명 반전 금지 — 조명이 위/아래에서 오면 horizontal 은 안전(run 경고가 방향으로 판단)
    elastic: { alpha: 0, sigma: 4 }
  placement:
    method: structure-aware
    roi: { method: otsu, erode_px: 8 }
    prefer: uniform            # 위치는 균등, 방향만 정렬
    strength: 1.0
    smooth_px: 3.0
    align: along               # 결·접선 방향에 긴 축 정렬
    min_coherence: 0.2
    min_anisotropy: 0.1
    jitter_deg: 5
    max_align_deg: 30         # 정렬 회전 상한 — 결·접선에 맞추려 30° 넘게 돌려야 하는 자리는 정렬 안 함(하이라이트 방향 우선, 0.7.3)
    margin_px: 8
    max_tries: 50
    shrink_on_fail: { factor: 0.8, rounds: 3 }
  blend:
    method: poisson
    poisson_mode: normal
    mask_dilate_px: 5
    feather_px: 3
  harmonize:
    method: stats
    strength: 0.2              # 음영 깊이 = 결함 신호. 낮게
    ring_px: 12
  degrade:
    method: camera
    noise_sigma: [0, 2.0]
    blur_sigma: [0, 0.6]
    jpeg_quality: null
    motion_blur_px: null
    vignette: null
    gamma: null
  gtmask:
    policy: union
    diff_threshold: 12
    dilate_px: 2
