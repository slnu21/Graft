# 샘플 데이터로 첫 합성 — repo 루트 또는 zip 을 푼 폴더에서 (상대경로는 현재 작업 디렉터리 기준; zip 이면 anograft → .\anograft.exe):
#   anograft sample --out samples/metal                                # 샘플 이미지 22장 + YOLO 박스 (= python tools/make_sample_yolo.py)
#   anograft bank import-yolo --images samples/metal/images --labels samples/metal/labels --names samples/metal/data.yaml `
#       --out bank/sample --list-normals samples/metal/normals.txt
#   anograft bank preview bank/sample --out out/bank-preview.png       # 추정 마스크 눈으로 확인 (amber = 추정, ellipse = 과라벨)
#   anograft run recipes/sample-poisson.yaml --workers 4               # → out/sample/{images,masks,meta,labels,data.yaml,manifest.csv}
#   anograft preview recipes/sample-poisson.yaml --index 0 --out out/sample-preview.png
#   anograft preview recipes/sample-poisson.yaml --index 0 --compare-methods blend --out out/compare-blend.png
version: 1
name: sample-poisson
seed: 20260914
inputs: {bank: bank/sample, targets: samples/metal/normals.txt, um_per_px: null}
output:
  root: out/sample
  count: 24
  class_ratio: null
  defects_per_image: [1, 2]
  include_normals: true
  copy_mode: copy
  writer: {format: yolo, seg: false, names_from: bank}   # 정본(images/masks/meta) + labels/·data.yaml — 기존 YOLO 학습셋에 그대로 합침
pipeline:
  preset: poisson-graft
  source: {method: bank, classes: null, min_sources_warn: 5}
