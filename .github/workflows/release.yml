name: Release
# 태그 push(v*) 시 (1) wheel/sdist 빌드 검증 (2) Windows zip 빌드 → GitHub Release 자산.
# **PyPI 게시는 하지 않는다**(사용자 결정 2026-09-26 — 배포 여부를 더 검토한다). 그래서 이 워크플로에는
# Trusted Publishing(OIDC)도, `environment: pypi` 도, 업로드 단계도 없다. 게시를 켜는 날 되돌릴 것은
# `pypa/gh-action-pypi-publish` 한 단계 + `id-token: write` + PyPI 쪽 pending publisher 등록이다.
# 배포용 산출물은 지금은 Windows zip 하나 — 아래 wheel 잡은 "wheel 이 만들어지고 번들이 실렸는가"만 본다.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # 웹 번들은 저장소에 없다(결정 6 ①) — 여기서 만들어야 wheel 에 실린다.
      # 빠뜨리면 git+https 로 설치한 사용자가 `serve` 에서 안내 페이지만 보게 된다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installs & imports (catches missing __init__.py)
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import anograft; print('import OK', anograft.__version__)"
          python -c "import anograft.web.static as _; from anograft.web.static import bundle_status; s = bundle_status(); assert s.present, '릴리스 wheel 에 웹 번들이 없다'; print('bundle OK')"

  windows-zip:
    # 파이썬 없는 PC용 단일 폴더 zip (PyInstaller onedir, CLI+GUI exe). 릴리스가 없으면 draft 로 만들고 자산을 올린다.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # zip 에도 웹 번들이 실려야 한다 — PyInstaller 의 collect_data_files("anograft") 가
      # `_internal/anograft/web/static/` 으로 옮겨 준다(빌드 시점에 파일이 있어야 한다).
      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install (gui + build)
        run: python -m pip install -e ".[gui,build]"
      - name: Build zip
        shell: pwsh
        run: .\tools\build_zip.ps1
      - name: Smoke (frozen CLI, spawn workers)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $exe = "dist\anograft-$ver-win64\anograft.exe"
          & $exe sample --out smoke\s --n-normal 2 --n-defect 2 --size 320 240
          & $exe bank import-yolo --images smoke\s\images --labels smoke\s\labels --names smoke\s\data.yaml --out smoke\bank --list-normals smoke\s\normals.txt
          & $exe recipe init --preset poisson-graft --bank smoke\bank --targets smoke\s\normals.txt --out smoke\out --count 4 --write smoke\r.yaml
          & $exe run smoke\r.yaml --workers 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --draft --title $env:TAG --notes "See CHANGELOG.md" }
          gh release upload $env:TAG (Get-ChildItem dist\*.zip).FullName --clobber
