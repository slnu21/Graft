name: CI
# 검증 = ruff + pytest + 빌드 + import 스모크. Windows·Linux 양쪽 — "다른 PC에서 설정 없이"가 요구사항.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # windows 러너에서도 dist/*.whl 글롭이 동작하게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installs & imports
        # dist 이름 = import 이름 = anograft.
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import anograft; print('import OK', anograft.__version__)"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/*
