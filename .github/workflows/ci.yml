name: CI
# 검증 = ruff + pytest + 빌드 + import 스모크. Windows·Linux 양쪽 — "다른 PC에서 설정 없이"가 요구사항.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    # 웹 UI(v0.10) — node 는 **빌드 때만** 필요하다(사용자는 node 의 존재를 모른다).
    # 한 job 안에서 프론트 테스트 → 번들 빌드 → 고지 최신 여부 → **번들이 실린 wheel 로 serve 스모크**까지 한 바퀴.
    # 번들이 *없는* 경로(소스 체크아웃의 정상 상태)는 tests/test_web.py 가 지키므로 build job 은 손대지 않는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install web deps (lock 그대로)
        working-directory: web
        run: npm ci
      - name: Frontend unit tests (vitest — 순수 함수만)
        working-directory: web
        run: npm test
      - name: Type check + build bundle
        working-directory: web
        run: npm run build
      - name: Third-party notices are up to date
        run: node tools/collect_npm_notices.mjs --check
      - name: Build wheel (번들 포함)
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Bundle really is inside the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert "anograft/web/static/index.html" in names, "wheel 에 웹 번들이 없다"
          assert any(n.startswith("anograft/web/static/assets/") for n in names), "assets 가 없다"
          print("bundle OK", whl)
          EOF
      - name: serve smoke (설치된 wheel 로)
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip install numpy opencv-python-headless pydantic pyyaml
          anograft serve --port 8123 --no-browser &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8123/api/health | grep -q '"ok": true'
          # 번들이 실렸으면 안내 페이지가 아니라 진짜 화면이 와야 한다
          curl -sf http://127.0.0.1:8123/ | grep -q '<div id="root">'
          # 한국어 라벨이 core/help.py 에서 실려 오는지(프론트에 사전 사본을 두지 않는 규약)
          curl -sf http://127.0.0.1:8123/api/methods | grep -q '결함 고르기'
          # 검수(U3): 열기 전 상태가 오고, 쓰기는 CSRF 헤더 없이는 거부된다
          curl -sf http://127.0.0.1:8123/api/review/state | grep -q '"open": false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8123/api/review/open)
          test "$code" = 403
          # 미리보기(U5a): 열기 전 상태 + 합성은 POST 전용(GET 이면 405 — 링크 한 번에 계산이 돌면 안 된다)
          curl -sf http://127.0.0.1:8123/api/studio/state | grep -q '"open": false'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/studio/preview)
          test "$code" = 405

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # windows 러너에서도 dist/*.whl 글롭이 동작하게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installs & imports
        # dist 이름 = import 이름 = anograft.
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import anograft; print('import OK', anograft.__version__)"
      - name: CLI e2e on the installed wheel
        env:
          PYTHONIOENCODING: utf-8   # windows 러너 콘솔은 cp1252 — 한글 CLI 출력
        # 설치된 wheel 의 콘솔 스크립트로 한 바퀴 — 프리셋 YAML 이 wheel 에 들어갔는지, 엔트리포인트·spawn 워커·writer·검수 CLI 가
        # 소스 트리 없이 도는지(cwd 를 옮겨서). train_smoke --dry-run 은 YOLO 출력을 학습셋 레이아웃으로 합치기만(ultralytics 없음).
        run: |
          mkdir -p ci-e2e && cd ci-e2e
          anograft --version
          anograft methods > /dev/null
          anograft sample --out s --n-normal 3 --n-defect 3 --size 320 240
          anograft bank import-yolo --images s/images --labels s/labels --names s/data.yaml --out bank --list-normals s/normals.txt
          anograft bank ls bank
          anograft recipe init --preset poisson-graft --bank bank --targets s/normals.txt --out out --count 4 --seed 7 --write r.yaml
          anograft run r.yaml --workers 2
          anograft run r.yaml --workers 0 --out out0
          python - <<'PY'
          from pathlib import Path
          a = {p.name: p.read_bytes() for p in Path("out/images").glob("*.png")}
          b = {p.name: p.read_bytes() for p in Path("out0/images").glob("*.png")}
          assert a and a == b, "workers 2 vs 0 결과가 다릅니다"
          print("determinism OK", len(a))
          PY
          anograft dataset report out --no-bank
          anograft dataset prune out --out out-pruned
          python ../tools/train_smoke.py --synthetic out --out train --dry-run
          # 0.7.3+ 한 줄 경로: ring 퀵스타트(은행·레시피 dent-graft+annulus·auto-dent) → dry-run 진단 → run --report → prune --drop-flipped
          anograft sample --out ring --shape ring --quickstart --n-normal 2 --n-defect 4 --size 320 320
          anograft recipe check ring/recipe.yaml
          anograft run ring/recipe.yaml --dry-run
          anograft run ring/recipe.yaml --count 2 --workers 0 --report
          anograft dataset prune ring/out --out ring/pruned --drop-flipped
          anograft doctor > /dev/null
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/*
